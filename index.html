    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; color: #333; background-color: #f9f9f9; }
        header { background-color: #fff; padding: 20px; text-align: center; border-bottom: 1px solid #ddd; }
        header h1 { margin: 0; font-size: 2em; letter-spacing: 2px; }
        nav { margin-top: 10px; }
        nav a { margin: 0 15px; text-decoration: none; color: #555; font-weight: 500; }
        .hero { background-color: #eae6e1; text-align: center; padding: 60px 20px; }
        .hero h2 { font-size: 2.5em; margin-bottom: 10px; }
        .products { display: flex; justify-content: center; gap: 20px; padding: 40px 20px; max-width: 1000px; margin: 0 auto; }
        .card { background: #fff; border: 1px solid #e0e0e0; padding: 20px; border-radius: 8px; text-align: center; width: 300px; }
        .card img { max-width: 100%; border-radius: 4px; }
        .btn { display: inline-block; background-color: #222; color: #fff; padding: 10px 20px; margin-top: 15px; border: none; cursor: pointer; text-decoration: none; border-radius: 4px; font-size: 0.9em; }
        .btn:hover { background-color: #444; }
        footer { text-align: center; padding: 20px; background-color: #fff; border-top: 1px solid #ddd; margin-top: 40px; font-size: 0.8em; color: #777; }

    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-XXXXXXX"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <header>
        <h1>LE TAPIS</h1>
        <nav>
            <a href="#cat-alfombras">Alfombras</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>

    <section class="hero">
        <h2>Diseño & Textura para tu Hogar</h2>
        <p>Descubrí nuestra colección exclusiva de alfombras artesanales.</p>
        <a href="#cat-alfombras" class="btn" id="btn-hero-banner">Ver Colección</a>
    </section>

    <section class="products" id="cat-alfombras">
        <div class="card">
            <h3>Alfombra Nórdica</h3>
            <p>100% Lana - 150x200 cm</p>
            <button class="btn btn-producto" data-product="Alfombra Nordica">Consultar Precio</button>
        </div>
        <div class="card">
            <h3>Alfombra Vinílica</h3>
            <p>Lavables e Impermeables</p>
            <button class="btn btn-producto" data-product="Alfombra Vinilica">Consultar Precio</button>
        </div>
    </section>

    <footer id="contacto">
        <p>Contacto vía Whatsapp para compras corporativas y minoristas.</p>
        <button class="btn" id="btn-whatsapp">Contactar por WhatsApp</button>
    </footer>
